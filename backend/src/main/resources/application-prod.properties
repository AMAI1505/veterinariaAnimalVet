server.forward-headers-strategy=framework
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jackson.serialization.indent-output=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

animalvet.initial-admin-password=${INITIAL_ADMIN_PASSWORD}
animalvet.initial-reception-password=${INITIAL_RECEPTION_PASSWORD}
animalvet.initial-vet-password=${INITIAL_VET_PASSWORD}
animalvet.admin-password-reset=${ADMIN_PASSWORD_RESET:}

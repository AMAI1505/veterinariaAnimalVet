<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: plantilla('Error 404 - AnimalVet', ~{::main})}">
    <main class="text-center py-5">
        <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 600px;">
            <div class="mb-4">
                <i class="bi bi-map-fill text-primary" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-5 text-primary fw-bold">Error 404</h1>
            <h3 class="fw-bold mb-3" th:text="${tituloError ?: 'Página No Encontrada'}">Página No Encontrada</h3>
            <p class="lead text-muted mb-4" th:text="${mensajeError ?: 'La ruta solicitada no existe o no se encuentra disponible.'}">No encontrado.</p>
            <p class="text-muted small mb-4" th:text="${descripcionError ?: 'Verifica la dirección URL escrita e intenta de nuevo.'}"></p>
            <div>
                <a href="javascript:history.back()" class="btn btn-secondary me-2">Volver</a>
                <a th:href="@{/citas}" class="btn btn-primary">Ir al Inicio</a>
            </div>
        </div>
    </main>
</div>
</html>

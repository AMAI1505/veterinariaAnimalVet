<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:replace="~{layout/base :: plantilla('Historial médico - AnimalVet', ~{::main})}">
<main class="pb-5">
  <a th:href="@{/mascotas}" class="btn btn-link px-0">← Volver a mascotas</a>
  <section class="hero-panel p-4 p-lg-5 mb-4">
    <div class="d-flex align-items-center gap-3">
      <img th:src="${mascota.fotoUrl != null ? mascota.fotoUrl : '/pet-placeholder.svg'}" alt="" class="pet-avatar">
      <div><span class="eyebrow">EXPEDIENTE CLÍNICO</span><h1 class="h2 mb-1" th:text="${mascota.nombre}"></h1><p class="mb-0" th:text="${mascota.especie + ' · ' + mascota.raza + ' · Dueño: ' + mascota.cliente.nombre}"></p></div>
    </div>
  </section>
  <div class="row g-4">
    <section class="col-lg-5" sec:authorize="hasRole('PROPIETARIO') or hasRole('VETERINARIO')">
      <div class="card clinic-card p-4"><h2 class="h5 mb-3">Registrar consulta</h2>
        <form th:action="@{/mascotas/{id}/historial(id=${mascota.id})}" th:object="${consulta}" method="post">
          <label class="form-label">Motivo de consulta</label><textarea class="form-control mb-3" th:field="*{motivo}" rows="2" required></textarea>
          <label class="form-label">Diagnóstico</label><textarea class="form-control mb-3" th:field="*{diagnostico}" rows="3" required></textarea>
          <label class="form-label">Tratamiento indicado</label><textarea class="form-control mb-3" th:field="*{tratamiento}" rows="2"></textarea>
          <label class="form-label">Observaciones / seguimiento</label><textarea class="form-control mb-3" th:field="*{observaciones}" rows="2"></textarea>
          <button class="btn btn-primary w-100" type="submit">Guardar en historial</button>
        </form>
      </div>
    </section>
    <section class="col-lg-7"><div class="card clinic-card p-4"><h2 class="h5 mb-4">Evolución clínica</h2>
      <div th:if="${#lists.isEmpty(consultas)}" class="empty-state">Aún no hay consultas registradas para esta mascota.</div>
      <article class="history-entry" th:each="item : ${consultas}">
        <div class="d-flex justify-content-between flex-wrap gap-2"><strong th:text="${item.fecha != null ? #temporals.format(item.fecha, 'dd/MM/yyyy HH:mm') : 'Consulta'}"></strong><span class="text-muted small" th:text="${'Dr(a). ' + item.veterinario.username}"></span></div>
        <p class="mb-1 mt-3"><b>Motivo:</b> <span th:text="${item.motivo}"></span></p><p class="mb-1"><b>Diagnóstico:</b> <span th:text="${item.diagnostico}"></span></p>
        <p class="mb-1" th:if="${item.tratamiento}"><b>Tratamiento:</b> <span th:text="${item.tratamiento}"></span></p><p class="mb-0" th:if="${item.observaciones}"><b>Seguimiento:</b> <span th:text="${item.observaciones}"></span></p>
      </article>
    </div></section>
  </div>
</main></div></html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: plantilla('Gestión de Usuarios - AnimalVet', ~{::main})}">
    <main>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Administración</a></li>
                        <li class="breadcrumb-item active">Usuarios</li>
                    </ol>
                </nav>
                <h1 class="h2 mb-0"><i class="bi bi-people-fill me-2 text-success"></i><b>Gestión de Usuarios</b></h1>
            </div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCrearUsuario">
                Nuevo Usuario
            </button>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${mensajeExito}" role="alert">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${mensajeError}" role="alert">
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

         <!-- Lista de usuarios -->
        <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(listaUsuarios)}">
            <p>No hay usuarios registrados.</p>
        </div>

        <div class="card border-0 shadow-sm mb-4" th:unless="${#lists.isEmpty(listaUsuarios)}">
            <div class="card-header bg-dark text-white">
                <strong>Usuarios del Sistema</strong>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${listaUsuarios}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.rol.nombre}"></td>
                            <td class="text-center" th:text="${u.enabled} ? 'Activo' : 'Inactivo'"></td>
                            <td class="text-center">
                                <form th:action="@{/admin/usuarios/eliminar}" method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="id" th:value="${u.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">
                                        Eliminar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

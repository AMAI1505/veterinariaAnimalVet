<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{layout/base :: plantilla('Gestión de Usuarios - AnimalVet', ~{::main})}">
    <main>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Administración</a></li>
                        <li class="breadcrumb-item active">Usuarios</li>
                    </ol>
                </nav>
                <h1 class="h2 mb-0"><i class="bi bi-people-fill me-2 text-success"></i><b>Gestión de Usuarios</b></h1>
            </div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCrearUsuario">
                Nuevo Usuario
            </button>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${mensajeExito}" role="alert">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${mensajeError}" role="alert">
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

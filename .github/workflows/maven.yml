name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Ejecutar pruebas con Maven
      run: ./mvnw test
      - name: Verificar version de Python
        run: python --version

      - name: Ejecutar pruebas automaticas
        run: python -m unittest -v

name: Integracion Continua - Veterinaria

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: Backend y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verificar backend y base de datos
        working-directory: backend
        run: bash ./mvnw -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  imagenes:
    name: Imágenes de despliegue
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de la API
        run: docker build --target api -t animalvet-api:ci .

      - name: Construir imagen del sitio web
        run: docker build --target web -t animalvet-web:ci .

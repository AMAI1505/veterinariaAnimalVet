services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:?set DB_NAME}?useSSL=false&allowPublicKeyRetrieval=false&serverTimezone=America/Lima
      DB_USERNAME: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      ANIMALVET_JWT_SECRET: ${ANIMALVET_JWT_SECRET:?set ANIMALVET_JWT_SECRET}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      INITIAL_RECEPTION_PASSWORD: ${INITIAL_RECEPTION_PASSWORD:?set INITIAL_RECEPTION_PASSWORD}
      INITIAL_VET_PASSWORD: ${INITIAL_VET_PASSWORD:?set INITIAL_VET_PASSWORD}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - animalvet-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [internal]

volumes:
  animalvet-db:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
